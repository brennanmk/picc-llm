x-resource-limits: &common-limits
  cpuset: ${CPU_SET}
  mem_limit: ${MEM_LIMIT}
 
services:
  db:
    <<: *common-limits
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env.docker
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *common-limits
    image: redis:alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/static:/var/www/html
    depends_on:
      - webapp

  webapp:
    <<: *common-limits
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/picc_llm/
      - venv_cache:/opt/venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["gunicorn", "picc_llm.app:app", "--reload", "--workers", "1", "--bind", "0.0:8000"]

  worker:
    <<: *common-limits
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/picc_llm/
      - venv_cache:/opt/venv
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["celery", "-A", "picc_llm.app.celery_app", "worker", "--loglevel=info"]

volumes:
  db_data:
  venv_cache:
  redis_data: {}
